<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
    --bg:#070606; --surface:#12100E; --surface2:#1C1814; --line:rgba(212,175,55,.28);
    --text:#F7F1E3; --muted:#B8AC93; --a:#E6C25A;
    --gold:#F0CB62; --gold-deep:#B8912B; --silver:#DAD3BF; --bronze:#B9803E;
    --red:#D1121F; --red-hi:#E5222E;
  }
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
  .font-display{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
  .muted{color:var(--muted)}
  .gold-link{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
  main:focus{outline:none}

  /* Header */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar::after{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--gold-deep),var(--red),var(--gold-deep),transparent);opacity:.8}
  .nav a{padding:.45rem .8rem;border-radius:999px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
  .nav a:hover{color:var(--text)}
  .nav a[aria-current="page"]{background:var(--surface2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}

  /* Home tiles */
  .sleeve{position:relative;overflow:hidden;isolation:isolate;background:var(--surface);color:var(--text);border:1.5px solid var(--gold-deep);border-radius:22px;min-height:260px;transition:transform .2s ease,border-color .2s}
  .sleeve:hover{transform:translateY(-3px);border-color:var(--gold)}
  .sleeve-body{padding:1.5rem;display:flex;flex-direction:column;height:100%}
  .sleeve-icon{font-size:2.4rem;line-height:1;margin-bottom:.75rem}
  .disc{position:absolute;z-index:-1;right:-130px;top:50%;--d:300px;margin-top:calc(var(--d) / -2);width:var(--d);height:var(--d);border-radius:50%;opacity:.85;
    background:
      radial-gradient(circle,#070606 0 4%,#d9b64f 5% 6%,var(--red) 7% 21%,#070606 22% 23%,transparent 24%),
      conic-gradient(from 0deg,transparent 0 8%,rgba(240,203,98,.30) 12%,transparent 17% 58%,rgba(240,203,98,.22) 62%,transparent 67%),
      repeating-radial-gradient(circle,#0c0a09 0 2px,#241c10 3px 5px);
    box-shadow:0 0 0 1.5px var(--gold-deep),0 10px 30px rgba(0,0,0,.6);
    animation:spin var(--t,10s) linear infinite;transition:right .4s ease}
  .sleeve:hover .disc{right:-100px}
  /* Logo (JN) presne v strede platne: funguje pre každú veľkosť platne (--d) */
  .vinyl-hub,.vinyl-hub-fallback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1/1;border-radius:50%}
  .vinyl-hub{z-index:3;background:var(--logo-url,none) center/cover no-repeat;box-shadow:0 0 0 2px var(--gold-deep),0 0 14px rgba(0,0,0,.65)}
  .vinyl-hub-fallback{z-index:2;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2a1f0a,#070606);border:2px solid var(--gold-deep);color:var(--gold);font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;line-height:1;font-size:calc(var(--d) * .115)}
  @media(max-width:640px){.disc{--d:230px;right:-105px}.sleeve:hover .disc{right:-85px}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .leader{margin-top:auto;padding:.6rem .85rem;border-radius:12px;background:rgba(7,6,6,.72);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .leader > *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill-dark{background:var(--red);color:#fff;padding:.55rem 1.1rem;border-radius:999px;font-weight:700;text-decoration:none}
  .pill-dark:hover{background:var(--red-hi)}
  .pill-dark::after{content:'';position:absolute;inset:0;z-index:1}
  .sleeve .alt-link{position:relative;z-index:2;font-weight:700;text-decoration:underline;text-underline-offset:4px;color:var(--gold)}

  /* Buttons & fields */
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:999px;font:inherit;font-weight:700;font-size:.9rem;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s,border-color .15s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-play{background:var(--red);color:#fff}
  .btn-play:hover:not(:disabled){background:var(--red-hi)}
  .btn-rate{background:transparent;border-color:var(--gold-deep);color:var(--gold)}
  .btn-rate:hover{border-color:var(--gold);background:rgba(230,194,90,.08)}
  .btn-rate.is-set{background:rgba(230,194,90,.14);border-color:var(--gold)}
  .btn-primary{background:var(--red);color:#fff}
  .btn-primary:hover{background:var(--red-hi)}
  .btn-ghost{background:var(--surface2);color:var(--text);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--gold-deep)}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:var(--red-hi)}
  .btn-sm{padding:.35rem .75rem;font-size:.8rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.25rem}
  .field{width:100%;background:#0b0909;border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:.7rem .85rem;font:inherit}
  .field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,194,90,.3)}
  label.lbl{display:block;font-weight:600;font-size:.9rem;margin-bottom:.3rem;color:var(--gold)}

  /* Song rows */
  .song{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem 1.15rem;overflow:hidden}
  .song-main{display:flex;align-items:center;gap:.85rem}
  .rank{width:2.2rem;flex:none;text-align:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.5rem;color:var(--muted)}
  .rank.top{color:var(--gold)}
  .song-meta{margin:.4rem 0 0 3.05rem;font-size:.8rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap}
  .song-actions{margin:.75rem 0 0 3.05rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .mini-disc{--d:46px;position:relative;flex:none;width:var(--d);height:var(--d);border-radius:50%;
    background:
      radial-gradient(circle,#070606 0 4%,#d9b64f 5% 6%,var(--red) 7% 30%,#070606 31% 32%,transparent 33%),
      conic-gradient(from 0deg,transparent 0 8%,rgba(240,203,98,.35) 12%,transparent 17% 58%,rgba(240,203,98,.25) 62%,transparent 67%),
      repeating-radial-gradient(circle,#0c0a09 0 1px,#241c10 2px 3px);
    box-shadow:0 0 0 1px var(--gold-deep),0 3px 10px rgba(0,0,0,.6);
    animation:spin var(--t,6s) linear infinite}
  .mini-disc.rev{animation-direction:reverse}
  .mini-disc .vinyl-hub,.mini-disc .vinyl-hub-fallback{width:46%}
  .mini-disc .vinyl-hub{box-shadow:0 0 0 1px var(--gold-deep)}
  .mini-disc .vinyl-hub-fallback{border-width:1px;font-size:calc(var(--d) * .17)}
  .player-slot:not(:empty){margin-top:.85rem}
  .player{border:1.5px solid var(--gold-deep);border-radius:14px;padding:.5rem;background:#000}
  .ratio{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
  .ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .rate-panel{margin-top:.85rem;padding-top:.85rem;border-top:1px dashed var(--line)}
  .rate-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
  .score{padding:.7rem 0;border-radius:10px;background:var(--surface2);color:var(--text);font:inherit;font-weight:700;border:1.5px solid var(--line);cursor:pointer}
  .score:hover{border-color:var(--red-hi)}
  .score.on{background:var(--red);border-color:var(--red);color:#fff}
  .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold-deep),var(--red));transition:width .4s ease}
  .song.flash{animation:flash 1.4s ease-out}
  @keyframes flash{from{box-shadow:0 0 0 3px var(--gold)}to{box-shadow:0 0 0 0 transparent}}
  @media(max-width:520px){.song-meta,.song-actions{margin-left:0}}
  @media(min-width:640px){.rate-grid{grid-template-columns:repeat(10,1fr)}}

  /* Tabs */
  .tab{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.9rem;text-decoration:none;color:var(--text);white-space:nowrap}
  .tab:hover{border-color:var(--gold)}
  .tab[aria-current="page"]{background:var(--red);color:#fff;border-color:var(--red)}

  /* Podium (zlaté rámiky) */
  .gold-frame{border:1.5px solid var(--gold-deep);box-shadow:0 0 0 4px #070606,0 0 0 5px var(--line)}
  .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;align-items:end;max-width:680px;margin:0 auto}
  .pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
  .pod-info{width:100%;padding:0 .2rem .75rem;min-width:0}
  .pod-info .nm{font-weight:700;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pod-info .tt{font-size:.8rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pedestal{width:100%;height:var(--h);background:linear-gradient(180deg,#241d12,#0d0b09);border:1.5px solid var(--m);border-top-width:5px;border-bottom:0;border-radius:14px 14px 0 0;display:flex;justify-content:center;align-items:flex-start;padding-top:.5rem;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:2.6rem;color:var(--m);transform-origin:bottom}
  .pod.first .pedestal{box-shadow:0 -10px 40px -12px var(--gold)}
  .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
  .fade{animation:fadeup .5s ease both;animation-delay:calc(var(--d) + .45s)}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pts{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}

  /* Modal & toast */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:1rem}
  .modal-card{background:var(--surface);border:1.5px solid var(--gold-deep);border-radius:20px;padding:1.5rem;max-width:26rem;width:100%}
  #toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--gold);color:#120d03;font-weight:700;padding:.7rem 1.1rem;border-radius:999px;max-width:92vw;text-align:center;transition:opacity .2s,transform .2s}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Bannery: 4 boxy, na počítači vedľa seba, na mobile pod sebou */
  .banner-grid{display:grid;gap:.75rem;grid-template-columns:1fr}
  @media(min-width:640px){.banner-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:1024px){.banner-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .banner{position:relative;display:flex;flex-direction:column;gap:.5rem;background:var(--surface);border:1.5px solid var(--gold-deep);border-radius:16px;padding:1.4rem .75rem .75rem;text-decoration:none;color:var(--text);overflow:hidden;transition:border-color .2s,transform .15s}
  a.banner:hover{border-color:var(--gold);transform:translateY(-2px)}
  .banner-label{position:absolute;top:.4rem;left:.8rem;right:.8rem;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .banner-media{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#241d12,#070606);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--gold)}
  .banner-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .banner-media.fit-contain::before{content:'';position:absolute;inset:-12px;background:var(--bg) center/cover no-repeat;filter:blur(14px) brightness(.55)}
  .banner-media.fit-contain img{object-fit:contain;padding:.35rem}
  .banner-play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(209,18,31,.92);box-shadow:0 0 0 2px #fff3}
  .banner-play::after{content:'';position:absolute;left:18px;top:13px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
  .banner .btn{margin-top:auto;align-self:flex-start}
  .share-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .share-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-width:46px;height:46px;padding:0 1rem;border-radius:999px;background:var(--surface2);border:1.5px solid var(--gold-deep);color:var(--gold);font:inherit;font-weight:700;font-size:.9rem;text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .1s}
  .share-btn:hover{background:var(--red);border-color:var(--red);color:#fff}
  .share-btn:active{transform:scale(.96)}
  .share-btn svg{width:20px;height:20px;flex:none}
  .share-row.compact .share-btn{height:40px;min-width:40px;padding:0 .7rem}
  .share-row.compact .share-btn span{display:none}
  .views{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .9rem;border-radius:999px;background:var(--surface2);border:1px solid var(--gold-deep);color:var(--gold);font-weight:600;font-size:.9rem}
  .views[hidden]{display:none}
  .views svg{width:22px;height:22px;flex:none}
  .views b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.2rem;color:var(--text);font-variant-numeric:tabular-nums}
  .chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface2);border:1px solid var(--line);color:var(--gold);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

const $ = s => document.querySelector(s);

function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function monthKeyNow(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function monthLabel(key){ const [y,m] = key.split('-').map(Number); return cap(MONTHS[m-1]) + ' ' + y; }
function nextKey(key){ const [y,m] = key.split('-').map(Number); return m === 12 ? (y+1)+'-01' : y+'-'+pad(m+1); }
function monthStatus(){
  const [y,m] = state.month.split('-').map(Number);
  const days = Math.ceil((new Date(y, m, 1) - new Date()) / 864e5);
  return days > 0 ? 'Do uzávierky zostáva ' + days + (days === 1 ? ' deň' : days < 5 ? ' dni' : ' dní') : 'Mesiac sa skončil, čaká na uzávierku';
}

/* ===================== YOUTUBE (bezpečné odkazy) ===================== */
function ytId(raw){
  try{
    let s = String(raw || '').trim(); if (!s) return '';
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    const u = new URL(s);
    const h = u.hostname.replace(/^(www|m|music)\./,'');
    let id = '';
    if (h === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com'){
      if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else { const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([^/?]+)/); if (m) id = m[2]; }
    }
    return /^[\w-]{11}$/.test(id) ? id : '';
  }catch(e){ return ''; }
}
// Vždy vráti bezpečný https odkaz: priamy klip, alebo vyhľadávanie na YouTube
function playUrl(s){
  const id = ytId(s.yt);
  return id ? 'https://www.youtube.com/watch?v=' + id
            : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(s.artist + ' ' + s.title);
}

let sbClient = null;
function sb(){
  if (!sbClient){
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error('Databáza nie je nastavená. Doplňte SUPABASE_URL a SUPABASE_ANON_KEY na začiatku skriptu.');
    if (!window.supabase || !window.supabase.createClient) throw new Error('Knižnicu Supabase sa nepodarilo načítať. Skontrolujte pripojenie na internet.');
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
  }
  return sbClient;
}
async function rpc(fn, args){
  const { data, error } = await sb().rpc(fn, args || {});
  if (error) throw new Error(error.message || 'Chyba databázy');
  return data;
}

}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(local)); }catch(e){} }

let state = { month: monthKeyNow(), songs: [], history: [], fan: null, mine: {}, nick: local.nick || '', logo: '', loaded: false, error: '' };

async function loadData(){
  const [st, mine] = await Promise.all([ rpc('get_state'), rpc('get_my_votes', { p_voter: local.voter }) ]);
  state.month = st.month || state.month;
  // Normalizácia: id vždy ako TEXT (data-id v HTML je text, číselné id by nikdy nesedelo pri ===),
  // akceptuje starý (category, url) aj nový (cat, yt) názov stĺpcov
  state.songs = (st.songs || []).map(x => ({
    id: String(x.id),
    cat: x.cat || x.category,
    artist: x.artist,
    title: x.title,
    yt: x.yt || x.url || '',
    points: Number(x.points) || 0,
    votes: Number(x.votes) || 0
  })).filter(x => CATS[x.cat] && x.artist && x.title);
  state.history = st.history || [];
  state.fan = st.fan || null;
  state.mine = mine || {};
  state.loaded = true; state.error = '';
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
function ask(title, text, ok){
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'modal';
    w.innerHTML = '<div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="mt">' +
      '<h3 id="mt" class="font-display text-xl font-extrabold">' + esc(title) + '</h3>' +
      '<p class="mt-2 muted">' + esc(text) + '</p>' +
      '<div class="mt-5 flex gap-2 justify-end"><button class="btn btn-ghost" data-r="0">Zrušiť</button>' +
      '<button class="btn btn-danger" data-r="1">' + esc(ok || 'Potvrdiť') + '</button></div></div>';
    document.body.appendChild(w);
    const done = v => { w.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    w.addEventListener('click', e => {
      const r = e.target.closest('[data-r]');
      if (r) done(r.dataset.r === '1'); else if (e.target === w) done(false);
    });
    document.addEventListener('keydown', onKey);
    w.querySelector('[data-r="0"]').focus();
  });
}
function normalizeNick(v){
  return String(v == null ? '' : v).normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim().replace(/\s+/g, ' ').slice(0, 30);
}
function saveNick(v){
  const nick = normalizeNick(v);
  state.nick = nick;
  local.nick = nick;
  saveLocal();
  return nick;
}

    const w = document.createElement('div'); w.className = 'modal';
    w.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="nickTitle">' +
      '<h3 id="nickTitle" class="font-display text-xl font-extrabold">Ako sa máme volať?</h3>' +
      '<p class="mt-2 muted">Pred hodnotením zadajte meno alebo prezývku. Uloží sa v tomto prehliadači a pôjde s každým hlasom.</p>' +
      '<label class="lbl mt-4" for="nickPrompt">Meno alebo prezývka</label>' +
      '<input id="nickPrompt" class="field" maxlength="30" autocomplete="nickname" placeholder="Napr. Jano, Mária, DJ Rom…">' +
      '<p id="nickPromptErr" class="text-sm mt-2" style="color:#FF8FA3;min-height:1.25em" role="alert"></p>' +
      '<div class="mt-4 flex gap-2 justify-end">' +
        '<button type="button" class="btn btn-ghost" data-r="0">Zrušiť</button>' +
        '<button type="button" class="btn btn-primary" data-r="1">Uložiť a hlasovať</button>' +
      '</div></div>';
    document.body.appendChild(w);
    const inp = w.querySelector('#nickPrompt');
    const err = w.querySelector('#nickPromptErr');
    const done = v => { w.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const submit = () => {
      const nick = normalizeNick(inp.value);
      if (!nick){ err.textContent = 'Zadajte meno alebo prezývku.'; inp.focus(); return; }
      done(nick);
    };
    const onKey = e => {
      if (e.key === 'Escape'){ e.preventDefault(); done(null); }
      else if (e.key === 'Enter'){ e.preventDefault(); submit(); }
    };
    w.addEventListener('click', e => {
      const r = e.target.closest('[data-r]');
      if (!r){ if (e.target === w) done(null); return; }
      if (r.dataset.r === '1') submit(); else done(null);
    });
    document.addEventListener('keydown', onKey);
    inp.focus();
  });
}

function safeHttps(u){
  try{
    let t = String(u || '').trim().replace(/\s+/g, '');
    if (!t) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(t)) t = 'https://' + t.replace(/^\/+/, '');
    const x = new URL(t);
    return x.protocol === 'https:' ? x.href : '';
  }catch(e){ return ''; }
}
function safeImg(u){
  const t = String(u || '').trim();
  if (/^data:image\/(webp|png|jpeg|gif);base64,[a-z0-9+\/=]+$/i.test(t)) return t;
  return safeHttps(t);
}
function bannerRowFromDb(r, fallback){
  const b = Object.assign({}, fallback || {});
  if (!r) return b;
  if (r.title != null && String(r.title).trim()) b.title = String(r.title).trim();
  const body = (r.body_text != null ? r.body_text : r.alt_text);
  if (body != null && String(body).trim()) b.text = String(body).trim();
  if (r.label != null && String(r.label).trim()) b.label = String(r.label).trim();
  if (r.image_url != null && String(r.image_url).trim()) b.image = String(r.image_url).trim();
  if (r.link_url != null && String(r.link_url).trim()) b.url = String(r.link_url).trim();
  b.button = BANNER_CTA;
  b.show = r.is_active !== false;
  return b;
}
function mergeBannersFromDb(rows){
  const bySlot = {};
  (rows || []).forEach(r => { if (r && BANNER_SLOTS.indexOf(r.slot) >= 0) bySlot[r.slot] = r; });
  return BANNER_SLOTS.map((slot, i) => {
    // Sloty mid/side/bottom: vždy natvrdo z BANNERS_DEFAULT (neprepisuje ich Supabase).
    if (BANNER_HARDCODED_SLOTS[slot]) return Object.assign({}, BANNERS_DEFAULT[i]);
    return bannerRowFromDb(bySlot[slot], BANNERS_DEFAULT[i]);
  });
}

// Čiastočné aktualizácie: prehrávané video sa pri otváraní hodnotenia nerestartuje
function syncRate(id){
  const s = state.songs.find(x => x.id === id), el = document.getElementById('song-' + id); if (!s || !el) return;
  el.querySelector('.rate-slot').innerHTML = ui.open === id ? ratePanelHTML(s) : '';
  el.querySelector('[data-act="toggle"]').setAttribute('aria-expanded', ui.open === id);
}
function toggleRate(id){
  const prev = ui.open; ui.open = prev === id ? null : id;
  if (prev) syncRate(prev); if (ui.open) syncRate(id);
  const el = document.getElementById('song-' + id); if (el && ui.open) el.scrollIntoView({ block:'nearest' });
}
async function castVote(id, score){
  const s = state.songs.find(x => x.id === id); if (!s || ui.busy) return;
  // Pri hodnotení 1–10 najprv vyžadujeme meno/prezývku (ak ešte nie je uložená).
  let nick = normalizeNick(state.nick || local.nick);
  if (score > 0){
    nick = await ensureNickForVote();
    if (!nick) return;
  }
  ui.busy = true;
  try{
    await rpc('cast_vote', { p_song:id, p_voter:local.voter, p_score:score, p_nick: nick || null });
    await loadData();
    ui.open = null; ui.play = null; ui.flash = id;
    paintList(s.cat);
    const pos = ranked(s.cat).findIndex(x => x.id === id) + 1;
    toast(score ? 'Uložené: ' + score + ' b. Skladba je teraz na ' + pos + '. mieste.' : 'Hodnotenie zrušené.');
    const el = document.getElementById('song-' + id);
    if (el) el.scrollIntoView({ block:'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
    setTimeout(() => { ui.flash = null; }, 1600);
  }catch(err){ toast('Hlas sa nepodarilo uložiť: ' + err.message); }
  finally{ ui.busy = false; }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'toggle'){ toggleRate(id); }
  else if (act === 'vote'){ castVote(id, Number(t.dataset.score)); }
  else if (act === 'unvote'){ castVote(id, 0); }
  else if (act === 'retry'){ boot(); }
  else if (act === 'lock'){ ui.admin = false; ui.pin = ''; viewAdmin(); }
  else if (act === 'save-nick'){
    const v = saveNick($('#nick') ? $('#nick').value : '');
    toast(v ? 'Meno uložené: ' + v : 'Meno odstránené.'); viewHome();
  }
  else if (act === 'copy-iban'){
    try{ await navigator.clipboard.writeText(ARTIST_IBAN.trim()); toast('IBAN skopírovaný.'); }
    catch(err){ toast('Kopírovanie sa nepodarilo, označte IBAN ručne.'); }
  }
  else if (act === 'share-copy'){ copyShareLink(); }
  else if (ui.admin){ adminAction(act, t); }
});

// PIN: orezanie bielych znakov a neviditeľných znakov (kopírovanie, mobilná klávesnica)
const cleanPin = v => String(v == null ? '' : v).normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();

// Zrozumiteľná správa podľa typu chyby z Supabase
function rpcErrorText(err){
  const m = String((err && err.message) || err || '');
  if (/Nesprávny PIN/i.test(m)) return 'Nesprávny PIN.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Nedá sa pripojiť k databáze. Skontrolujte internet a SUPABASE_URL.';
  if (/Could not find the function|PGRST202|schema cache/i.test(m)) return 'V databáze chýba funkcia správcu. Spustite celý súbor supabase-setup.sql v SQL Editore.';
  if (/crypt|gen_salt|pgcrypto/i.test(m)) return 'V databáze chýba rozšírenie pgcrypto. Spustite supabase-setup.sql znova.';
  if (/Invalid API key|apikey|JWT/i.test(m)) return 'Neplatný kľúč SUPABASE_ANON_KEY.';
  if (/permission denied/i.test(m)) return 'Databáza odmietla prístup. Skontrolujte sekciu GRANT na konci supabase-setup.sql.';
  return 'Chyba: ' + m;
}

// Overí PIN na serveri (RPC admin_check). Pri úspechu odomkne panel a zapamätá si PIN do ďalších akcií.
async function verifyAdminPin(rawPin){
  const pin = cleanPin(rawPin);
  if (!pin) return { ok:false, message:'Zadajte PIN.' };
  try{
    const ok = await rpc('admin_check', { p_pin: pin });
    if (ok === true){ ui.admin = true; ui.pin = pin; return { ok:true }; }
    return { ok:false, message:'Nesprávny PIN.' };
  }catch(err){
    ui.admin = false; ui.pin = '';
    return { ok:false, message: rpcErrorText(err) };
  }
}

// Pridá skladbu cez RPC admin_add_song. Nová skladba vždy začína s 0 bodmi a 0 hlasmi.
async function addNewSong(f){
  const msg = (t, ok) => { const m = $('#formMsg'); if (m){ m.textContent = t; m.style.color = ok ? '#7CE3B0' : '#FF8FA3'; } };
  const btn = f.querySelector('button[type="submit"]');
  const artist = String(f.artist.value).trim().replace(/\s+/g, ' ').slice(0, 80);
  const title  = String(f.title.value).trim().replace(/\s+/g, ' ').slice(0, 80);
  const cat = f.cat.value;
  const vid = ytId(String(f.yt.value).trim());

  if (!ui.admin || !ui.pin){ viewAdmin(); toast('Najprv sa prihláste PIN-om.'); return; }
  if (!artist || !title) return msg('Vyplňte interpreta aj názov skladby.');
  if (!CATS[cat]) return msg('Vyberte platnú kategóriu.');
  if (!vid) return msg('Zadajte platný YouTube odkaz, napr. https://www.youtube.com/watch?v=... alebo https://youtu.be/...');

  if (btn) btn.disabled = true;
  msg('Ukladám…', true);
  try{
    await rpc('admin_add_song', { p_pin: ui.pin, p_cat: cat, p_artist: artist, p_title: title, p_yt: 'https://www.youtube.com/watch?v=' + vid });
    await loadData();
    ui.lastCat = cat; viewAdmin();
    const m2 = $('#formMsg'); m2.style.color = '#7CE3B0';
    m2.innerHTML = 'Pridané: <b>' + esc(artist) + ' – ' + esc(title) + '</b> do kategórie ' + esc(CATS[cat].name) + ' (0 bodov). <a href="#/kategoria/' + cat + '" style="text-decoration:underline">Otvoriť hitparádu</a>';
    $('#f-artist').focus(); toast('Skladba pridaná s 0 bodmi.');
  }catch(err){
    if (/Nesprávny PIN/i.test(String(err && err.message))){ ui.admin = false; ui.pin = ''; viewAdmin(); toast('PIN už neplatí, prihláste sa znova.'); }
    else { msg(rpcErrorText(err)); if (btn) btn.disabled = false; }
  }
}

document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'pinForm'){
    e.preventDefault();
    const btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
    const res = await verifyAdminPin(f.pin.value);
    if (res.ok){ viewAdmin(); toast('Správca prihlásený.'); }
    else { if (btn) btn.disabled = false; $('#pinMsg').textContent = res.message; f.pin.value = ''; f.pin.focus(); }
  } else if (f.id === 'addForm'){
    e.preventDefault();
    addNewSong(f);
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'period'){
    const v = e.target.value;
    location.hash = '#/vysledky/' + e.target.dataset.cat + (v === 'live' ? '' : '?m=' + encodeURIComponent(v));
  }
});

/* ===================== ROUTER ===================== */
function viewLoading(){
  $('#app').innerHTML = state.error
    ? '<div class="card gold-frame"><h1 class="font-display font-extrabold text-2xl">Hitparáda sa nenačítala</h1><p class="muted mt-2" style="overflow-wrap:anywhere">' + esc(state.error) + '</p><button class="btn btn-primary mt-4" data-act="retry">Skúsiť znova</button></div>'
    : '<p class="muted" role="status">Načítavam hitparádu…</p>';
}
function renderRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs = ''] = raw.split('?');
  const seg = path.split('/').filter(Boolean), q = new URLSearchParams(qs);
  const isCat = seg[0] === 'kategoria' && CATS[seg[1]];
  const nav = isCat ? '' : seg[0] === 'vysledky' ? 'results' : seg[0] === 'sprava' ? 'admin' : 'home';
  if (!state.loaded) viewLoading();
  else if (isCat) viewCat(seg[1]);
  else if (nav === 'results') viewResults(CATS[seg[1]] ? seg[1] : 'czsk', q.get('m') || 'live');
  else if (nav === 'admin'){ if (CATS[q.get('cat')]) ui.lastCat = q.get('cat'); viewAdmin(); }
  else viewHome();
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}
function route(){ ui.open = null; ui.play = null; renderRoute(); window.scrollTo(0,0); }
async function adminAction(act, t){
  try{
    if (act === 'delete'){
      const s = state.songs.find(x => x.id === t.dataset.id); if (!s) return;
      if (await ask('Odstrániť skladbu?', s.artist + ' – ' + s.title + ' zmizne z hitparády aj s bodmi.', 'Odstrániť')){
        await rpc('admin_delete_song', { p_pin: ui.pin, p_id: s.id }); await loadData(); viewAdmin(); toast('Skladba odstránená.');
      }
    } else if (act === 'close-month'){
      const clear = !!($('#clearSongs') && $('#clearSongs').checked);
      if (await ask('Uzavrieť ' + monthLabel(state.month) + '?', 'Výsledky sa uložia do Siene slávy, body a hlasy sa vynulujú a začne ďalší mesiac.' + (clear ? ' Skladby budú odstránené.' : ''), 'Uzavrieť mesiac')){
        await rpc('admin_close_month', { p_pin: ui.pin, p_label: monthLabel(state.month), p_clear: clear });
        await loadData(); viewAdmin(); toast('Mesiac uzavretý. Začal sa ' + monthLabel(state.month) + '.');
      }
    } else if (act === 'reset-points'){
      if (await ask('Vynulovať body?', 'Všetky body a hlasy všetkých návštevníkov sa vynulujú. Výsledky sa neuložia do Siene slávy.', 'Vynulovať')){
        await rpc('admin_reset_points', { p_pin: ui.pin }); await loadData(); viewAdmin(); toast('Body vynulované.');
      }
    } else if (act === 'wipe'){
      const sel = t.dataset.cat || ($('#wipeCat') ? $('#wipeCat').value : 'all');
      const count = state.songs.filter(x => sel === 'all' || x.cat === sel).length;
      if (!count){ toast('V tejto voľbe nie sú žiadne skladby.'); return; }
      const label = sel === 'all' ? 'všetkých kategórií' : CATS[sel].name;
      if (await ask('Vymazať skladby: ' + label + '?', 'Natrvalo sa vymaže ' + count + ' skladieb vrátane názvov, YouTube odkazov, bodov a hlasov všetkých návštevníkov. Výsledky sa neuložia do Siene slávy. Túto akciu nemožno vrátiť.', 'Vymazať natrvalo')){
        await rpc('admin_wipe', { p_pin: ui.pin, p_cat: sel }); await loadData(); viewAdmin();
        toast('Vymazané skladby: ' + count + '. Môžete pridať nové.');
      }
    }
  }catch(err){
    if (/PIN/.test(err.message)){ ui.admin = false; ui.pin = ''; viewAdmin(); toast('PIN už neplatí, prihláste sa znova.'); }
    else toast('Akcia zlyhala: ' + err.message);
  }
}
window.addEventListener('hashchange', route);
renderBrand();
renderShareFooter();
renderBanners(BANNERS_DEFAULT);
loadBanners();
trackViews();
async function boot(){
  state.error = ''; state.loaded = false; route();
  try{ await loadData(); }catch(err){ state.error = err.message; }
  renderRoute();
}
boot();
// Priebežné obnovovanie rebríčka (hlasy ostatných návštevníkov), ak práve nič nepíšete
async function poll(){
  const el = document.activeElement;
  if (document.visibilityState !== 'visible' || !state.loaded || ui.busy || ui.open || ui.admin) return;
  if (location.hash.indexOf('#/sprava') === 0) return;
  if (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
  try{ await loadData(); renderRoute(); }catch(err){}
}
setInterval(poll, 45000);
document.addEventListener('visibilitychange', poll);
})();
</script>
</body><!-- Hitparáda TopRom – Vstavaný YouTube prehrávač (PC + Mobil) -->
<script>
(function () {
  if (window.__topRomWebPlayerLoaded) return;
  window.__topRomWebPlayerLoaded = true;

  function extractYouTubeId(url) {
    if (!url || typeof url !== 'string') return null;
    var patterns = [
      /(?:youtube\.com|youtube-nocookie\.com)\/watch\/?\?(?:[^#]*&)?v=([A-Za-z0-9_-]{11})/i,
      /youtu\.be\/([A-Za-z0-9_-]{11})/i,
      /(?:youtube\.com|youtube-nocookie\.com)\/(?:shorts|embed|live|v)\/([A-Za-z0-9_-]{11})/i
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = url.match(patterns[i]);
      if (m && m[1]) return m[1];
    }
    return null;
  }

  function guessTitle(el) {
    if (!el) return 'Hitparáda TopRom';
    var card = el.closest && el.closest('article, li, tr, [class*="card"], [class*="song"], [class*="track"], div');
    if (card) {
      var h = card.querySelector('h1, h2, h3, h4, strong, [class*="title"], [class*="name"]');
      if (h && h.innerText) {
        var t = h.innerText.replace(/\s+/g, ' ').trim();
        if (t.length >= 2 && t.length <= 90) return t;
      }
    }
    return 'Hitparáda TopRom';
  }

  // Štýly prehrávača (prispôsobené pre PC aj mobil)
  var style = document.createElement('style');
  style.textContent =
    '#toprom-yt-dock{position:fixed;right:16px;bottom:16px;width:420px;max-width:calc(100vw - 24px);' +
    'background:#180d22;border:1.5px solid #f2b84b;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.65);' +
    'z-index:999999;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;display:none;}' +
    '@media(max-width:640px){#toprom-yt-dock{left:12px;right:12px;bottom:12px;width:auto;max-width:none;}}' +
    '#toprom-yt-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#241333;}' +
    '#toprom-yt-title{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f7f2fa;}' +
    '.toprom-yt-btn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:5px 9px;' +
    'font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}' +
    '.toprom-yt-btn:hover{background:rgba(242,184,75,.28);}' +
    '#toprom-yt-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;}' +
    '#toprom-yt-iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}';
  document.head.appendChild(style);

  // Vytvorenie okna prehrávača
  var dock = document.createElement('div');
  dock.id = 'toprom-yt-dock';

  var head = document.createElement('div');
  head.id = 'toprom-yt-head';

  var titleEl = document.createElement('div');
  titleEl.id = 'toprom-yt-title';
  titleEl.textContent = 'Hitparáda TopRom';

  var extLink = document.createElement('a');
  extLink.className = 'toprom-yt-btn';
  extLink.target = '_blank';
  extLink.rel = 'noopener noreferrer';
  extLink.textContent = 'YouTube ↗';

  var closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'toprom-yt-btn';
  closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Zavrieť prehrávač');

  head.appendChild(titleEl);
  head.appendChild(extLink);
  head.appendChild(closeBtn);

  var wrap = document.createElement('div');
  wrap.id = 'toprom-yt-frame-wrap';

  var iframe = document.createElement('iframe');
  iframe.id = 'toprom-yt-iframe';
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
  iframe.setAttribute('allowfullscreen', '');

  wrap.appendChild(iframe);
  dock.appendChild(head);
  dock.appendChild(wrap);
  document.body.appendChild(dock);

  function openInAppPlayer(videoId, titleText) {
    if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) return;
    titleEl.textContent = titleText || 'Hitparáda TopRom';
    extLink.href = 'https://www.youtube.com/watch?v=' + videoId;
    iframe.src =
      'https://www.youtube.com/embed/' + videoId +
      '?autoplay=1&playsinline=1&rel=0&modestbranding=1';
    dock.style.display = 'block';
  }

  closeBtn.addEventListener('click', function () {
    iframe.src = 'about:blank';
    dock.style.display = 'none';
  });

  var lastTitle = '';

  // Zachytí kliknutia na všetky <a href="...youtube..."> odkazy
  document.addEventListener('click', function (e) {
    lastTitle = guessTitle(e.target);
    var anchor = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!anchor) return;
    // Ignorovať tlačidlo "YouTube ↗" v našom vlastnom prehrávači
    if (dock.contains(anchor)) return;
    var vid = extractYouTubeId(anchor.href);
    if (vid) {
      e.preventDefault();
      e.stopPropagation();
      openInAppPlayer(vid, guessTitle(anchor));
    }
  }, true);

  // Zachytí aj prípad, keď tlačidlo otvára YouTube cez window.open(...)
  var origOpen = window.open;
  window.open = function (url) {
    var vid = extractYouTubeId(typeof url === 'string' ? url : '');
    if (vid) {
      openInAppPlayer(vid, lastTitle);
      return null;
    }
    return origOpen ? origOpen.apply(window, arguments) : null;
  };
})();
</script>
